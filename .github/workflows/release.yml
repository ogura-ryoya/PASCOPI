# リリースを公開すると PASCOPI.exe をビルドし、PASCOPI.ahk と一緒にリリースへ添付する
# 手動実行（workflow_dispatch）の場合はビルド結果を Artifacts に保存するだけ

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AutoHotkey v2 and Ahk2Exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Invoke-WebRequest https://www.autohotkey.com/download/ahk-v2.zip -OutFile ahk.zip
          Expand-Archive ahk.zip -DestinationPath ahk
          gh release download --repo AutoHotkey/Ahk2Exe --pattern "Ahk2Exe*.zip" --output ahk2exe.zip
          Expand-Archive ahk2exe.zip -DestinationPath ahk2exe

      - name: Build PASCOPI.exe
        shell: pwsh
        run: |
          $proc = Start-Process ahk2exe\Ahk2Exe.exe -Wait -PassThru -ArgumentList @(
            '/in', 'PASCOPI.ahk',
            '/out', 'PASCOPI.exe',
            '/base', 'ahk\AutoHotkey64.exe',
            '/silent', 'verbose'
          )
          if ($proc.ExitCode -ne 0 -or -not (Test-Path PASCOPI.exe)) {
            throw "Ahk2Exe failed (exit code $($proc.ExitCode))"
          }

      - name: Upload to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" PASCOPI.exe PASCOPI.ahk --clobber

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PASCOPI
          path: |
            PASCOPI.exe
            PASCOPI.ahk
